# ── Goals iniciais ───────────────────────────────────────────────────────────
#
# Carregados na criação da cena (antes do primeiro episódio).
# mode: fixed → posição fixa; random → aleatória a cada episódio (futuro)
#
initial:
  mode: "fixed"
  targets:
    - object: "cube_1"
      position: [0.0, -0.20, 0.02]
      tolerance: 0.05
      visual_marker: true

# ── Mudanças de goal em tempo de execução ────────────────────────────────────
#
# Cada entrada dispara uma operação change_goal sem resetar a física.
# O cubo e o robô ficam exatamente onde estão.
#
# Campos:
#   id            — identificador único (cada id dispara apenas uma vez)
#   enabled       — true para ativar
#   at_episode: N — dispara no episódio N (omitir = qualquer episódio)
#   at_step: N    — dispara no step N     (omitir = primeiro step disponível)
#   target_object — nome do objeto cujo goal será alterado
#   position      — nova posição [x, y, z]
#   tolerance     — raio de aceitação em metros
#   visual_marker — move o marcador visual verde para a nova posição
#
changes:
  - id: "goal_direita"
    enabled: false
    at_episode: 0
    at_step: 30
    target_object: "cube_1"
    position: [0.10, -0.20, 0.02]
    tolerance: 0.05
    visual_marker: true

  - id: "goal_frente"
    enabled: false
    at_episode: 0
    at_step: 60
    target_object: "cube_1"
    position: [0.10, 0.10, 0.02]
    tolerance: 0.05
    visual_marker: true
