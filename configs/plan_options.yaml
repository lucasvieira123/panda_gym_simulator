# ── Opções de plano MAPE-K (Plan) ────────────────────────────────────────────
#
# Cada plano define a resposta a uma análise produzida pelo Analyze.
#
#   given — string de análise (campo 'then' em adaptation_options.yaml)
#   then  — ação ou sequência de ações a executar
#   enabled — true (padrão) | false para desabilitar sem remover
#
# ── Ações disponíveis ─────────────────────────────────────────────────────────
#
#   reset_phase
#     Reseta a fase da política interna para que o robô reposicione
#     em relação ao estado atual (ex: novo goal, nova posição do cubo).
#
#   cautious_mode
#     Ativa gain reduzido por N steps para movimentos mais controlados.
#       steps:       número de steps no modo cauteloso  (padrão: 20)
#       gain_factor: multiplicador do gain              (padrão: 0.4)
#
# ─────────────────────────────────────────────────────────────────────────────

plans:

  - id: "plan_s1_target_relocation"
    description: "Resposta à mudança de alvo durante execução"
    enabled: true
    given: "S1_target_relocation"
    then:
      - action: "switch_behavior"
        name: "random"
        steps: 30        # após 30 steps, reverte para o behavior anterior

