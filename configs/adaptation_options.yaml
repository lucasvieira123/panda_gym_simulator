# ── Opções de adaptação MAPE-K (Analyze) ─────────────────────────────────────
#
# Cada regra define uma situação prevista usando Given/Then:
#
#   given  — lista de condições booleanas sobre os parâmetros monitorados
#            (todas precisam ser verdadeiras para a regra disparar — AND implícito)
#   then   — string de análise retornada quando a regra dispara
#   execute— parâmetros opcionais que configuram a resposta Plan+Execute
#
# Operadores suportados em 'given':  ==  !=  >  <  >=  <=
#
# ── Campos disponíveis no 'given' ────────────────────────────────────────────
#
#   step                  número do step atual
#
#   goal_changed          bool — desired_goal mudou mais de 1 cm desde o step anterior
#   goal.distance         distância euclidiana achieved → desired  (metros)
#   goal.height           coordenada Z do desired_goal
#   goal.desired.x/y/z    posição do alvo
#   goal.achieved.x/y/z   posição atual do objeto rastreado
#
#   ee.speed              magnitude da velocidade do end-effector  (m/s)
#   ee.fingers_width      abertura da garra  (metros)
#   ee.position.x/y/z     posição do end-effector
#   ee.velocity.x/y/z     velocidade do end-effector por eixo
#
#   cube.speed            magnitude da velocidade do cubo  (m/s)
#   cube.position.x/y/z   posição do cubo
#
# ── Parâmetros de execute ─────────────────────────────────────────────────────
#
#   cautious_steps        steps com gain reduzido após detecção  (padrão: 20)
#   cautious_gain_factor  fator multiplicador do gain  (padrão: 0.4)
#
# ─────────────────────────────────────────────────────────────────────────────

rules:

  # S1 — Alvo muda durante a execução
  - id: "S1_target_relocation"
    description: "Alvo muda de posição durante a execução"
    enabled: true
    given:
      - "goal_changed == true"
    then: "S1_target_relocation"
    execute:
      cautious_steps: 20
      cautious_gain_factor: 0.4

  # Exemplo: cubo longe do goal E praticamente parado (robô não progride)
