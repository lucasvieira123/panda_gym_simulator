# ── Política e task padrão ───────────────────────────────────────────────────

# O que o task faz ? NORMALMENTE NAO PRECISA SER ALTERADO NADA
# ● Cria a cena a partir do YAML:

#   1. Mesa — dimensões, fricção
#   2. Objetos — cria os corpos físicos no PyBullet (cubo, esfera, cilindro) com massa, cor, fricção
#   3. Obstáculos — mesmos tipos, mas estáticos (mass: 0)
#   4. Marcadores visuais — esferas verdes semitransparentes nas posições dos goals

#   E a cada step responde ao ambiente com:
#   - Posição atual dos objetos → achieved_goal
#   - Posição + velocidade dos objetos → observation
#   - -distância(cubo, goal) ou 0/-1 → reward
#   - distância < tolerance → success

#   Em resumo: monta a física da cena e define as regras de sucesso/recompensa. Não decide como o robô age — isso é responsabilidade da policy.
task:
  type: "configurable"  # tipo de task customizada (ConfigurableTask)
  reward_type: "dense"  # sparse | dense
# ---------------------------

# O que a política faz ?
# ● Define como o robô decide qual ação tomar a cada step.                                                                                                                                                        

#   - name — qual estratégia usar:
#     - greedy_push → posiciona atrás do cubo e empurra em direção ao goal
#     - greedy_pick_and_place → abre garra, desce, pega, levanta, carrega, solta
#     - greedy_goal → move o end-effector direto ao goal (bom para Reach)
#     - random → ações aleatórias
#     - hold → robô parado
#     - manual → controle manual via teclado (WASD para x/y, RF para z, QE para garra)
#     - self_adaptive → mape-k
#   - gain → intensidade do movimento. 5.0 significa que o vetor de direção é multiplicado por 5 antes de virar ação. Quanto maior, mais agressivo/rápido o movimento.
policy:
  name: "greedy_goal"   # random | hold | greedy_goal | greedy_push | greedy_pick_and_place | manual
  gain: 5.0



commands:
  # ── run_script: executa sequência de ações primitivas ───────────────────────
  #
  # Cada passo define um vetor de ação e quantos steps mantê-lo:
  #   action: [dx, dy, dz, gripper]   — valores em [-1.0, +1.0]
  #   steps: N                         — quantos steps executar
  #
  # Após o último passo, a política volta para policy_after (padrão: hold).
  #
  # Referência rápida de ações:
  #   dx  > 0 → direita   |  dx  < 0 → esquerda
  #   dy  > 0 → frente    |  dy  < 0 → trás
  #   dz  > 0 → sobe      |  dz  < 0 → desce
  #   gripper +1.0 → abre |  gripper -1.0 → fecha
  #   (deslocamento máximo por step: 5 cm por eixo)
  #
  - id: "script_pegar_cubo"
    enabled: false
    operation: "run_script"
    at_episode: 0
    at_step: 10
    policy_after: "hold"
    script:
      - action: [0.0,  0.0,  0.0,  1.0]   # abre garra
        steps: 3
      - action: [0.0,  0.0,  1.0,  1.0]   # sobe com garra aberta
        steps: 8
      - action: [0.5,  0.0,  0.0,  1.0]   # move para direita
        steps: 6
      - action: [0.0,  0.0, -1.0,  1.0]   # desce até o cubo
        steps: 8
      - action: [0.0,  0.0,  0.0, -1.0]   # fecha garra (agarra)
        steps: 5
      - action: [0.0,  0.0,  1.0, -1.0]   # levanta com garra fechada
        steps: 10
      - action: [-0.5, 0.0,  0.0, -1.0]   # move para esquerda (leva para outro lugar)
        steps: 6
      - action: [0.0,  0.0,  0.0,  1.0]   # abre garra (solta)
        steps: 3

  - id: "script_simples_sobe_desce"
    enabled: false
    operation: "run_script"
    # at_episode: 0
    # at_step: 20
    policy_after: "greedy_push"            # volta para push depois
    script:
      - action: [0.0, 0.0,  1.0, 0.0]     # sobe
        steps: 10
      - action: [0.0, 0.0, -1.0, 0.0]     # desce
        steps: 10

  # ── change_task_mode: muda objetivo e política SEM resetar a física ─────────
  #
  # O cubo e o robô ficam exatamente onde estão.
  # Ideal para: push → pick_and_place no meio do episódio.
  #
  # position pode ter z > 0 para goals no ar (ex: [0.2, 0.0, 0.15])
  #
  - id: "switch_to_pick_mode"
    enabled: false
    operation: "change_task_mode" # NUNCA MUDAR
    at_episode: 0
    at_step: 0               # muda no step 30: robô para de empurrar e começa a pegar
    target_object: "cube_1"
    position: [0.10, 0.10, 0.15]   # goal no ar: cubo tem de ser levantado
    tolerance: 0.05
    visual_marker: true
    policy: "greedy_pick_and_place"

  - id: "switch_back_to_push"
    enabled: false
    operation: "change_task_mode"
    at_episode: 0
    at_step: 80
    target_object: "cube_1"
    position: [0.0, 0.20, 0.02]
    tolerance: 0.05
    visual_marker: true
    policy: "greedy_push"

  # ── change_task: troca a task em tempo de execução (janela não fecha) ───────
  #
  # task (obrigatório): uma das 6 tasks do panda-gym
  #   reach | push | slide | pick_and_place | stack | flip
  #
  # reward_type (opcional): sparse (padrão) | dense
  #
  # policy (opcional): muda a política junto com a task
  #   greedy_goal  → funciona bem para reach (move ee direto ao goal)
  #   greedy_push  → funciona bem para push/slide
  #   random       → exploração aleatória
  #   hold         → parado (útil para observar)
  #
  - id: "switch_to_reach"
    enabled: false
    operation: "change_task"
    task: "reach"
    reward_type: "dense"
    policy: "greedy_goal"     # reach: mover ee ao alvo → greedy_goal funciona

  - id: "switch_to_slide"
    enabled: false
    operation: "change_task"
    task: "slide"
    at_episode: 0
    at_step: 10
    reward_type: "dense"
    policy: "greedy_push"

  - id: "switch_to_pick_place"
    enabled: false
    operation: "change_task"
    task: "pick_and_place"
    reward_type: "dense"
    policy: "random"          # sem política dedicada por enquanto

  - id: "switch_to_pick_mode"
    enabled: false
    operation: "change_task_mode"      # ← este, não change_task
    target_object: "cube_1"
    # position: [0.10, 0.10, 0.15]      # goal no ar
    # tolerance: 0.05
    visual_marker: true
    policy: "greedy_pick_and_place"   

  - id: "switch_to_push_step50"
    enabled: false
    operation: "change_task"
    at_episode: 0
    at_step: 50               # troca para push no step 50 do episódio 0
    task: "push"
    reward_type: "dense"
    policy: "greedy_push"