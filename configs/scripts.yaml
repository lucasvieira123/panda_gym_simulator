# ── Scripts de execução em tempo real ────────────────────────────────────────
#
# Comandos que podem ser disparados enquanto a simulação está rodando.
# O runner relê este arquivo a cada N steps (poll_every_steps em environment.yaml).
#
# Campos comuns:
#   id          — identificador único (cada id dispara apenas uma vez)
#   enabled     — true para ativar
#   at_episode  — dispara no episódio N  (omitir = qualquer episódio)
#   at_step     — dispara no step N      (omitir = primeiro step disponível)
#
# ── Operações disponíveis ─────────────────────────────────────────────────────
#
#   run_script       — executa sequência de ações primitivas
#   change_goal      — muda o alvo sem resetar a física
#   change_task_mode — muda goal + política sem resetar a física
#   change_task      — troca a task inteira (reach, push, slide, ...)
#
# ─────────────────────────────────────────────────────────────────────────────

scripts:

  # ── run_script ───────────────────────────────────────────────────────────────
  #
  # Referência de ações [dx, dy, dz, gripper]:
  #   dx  > 0 → direita   |  dx  < 0 → esquerda
  #   dy  > 0 → frente    |  dy  < 0 → trás
  #   dz  > 0 → sobe      |  dz  < 0 → desce
  #   gripper +1.0 → abre |  gripper -1.0 → fecha
  #   (deslocamento máximo por step: 5 cm por eixo)
  #
  - id: "script_pegar_cubo"
    enabled: false
    operation: "run_script"
    at_episode: 0
    at_step: 10
    policy_after: "hold"
    script:
      - action: [0.0,  0.0,  0.0,  1.0]   # abre garra
        steps: 3
      - action: [0.0,  0.0,  1.0,  1.0]   # sobe com garra aberta
        steps: 8
      - action: [0.5,  0.0,  0.0,  1.0]   # move para direita
        steps: 6
      - action: [0.0,  0.0, -1.0,  1.0]   # desce até o cubo
        steps: 8
      - action: [0.0,  0.0,  0.0, -1.0]   # fecha garra (agarra)
        steps: 5
      - action: [0.0,  0.0,  1.0, -1.0]   # levanta com garra fechada
        steps: 10
      - action: [-0.5, 0.0,  0.0, -1.0]   # move para esquerda
        steps: 6
      - action: [0.0,  0.0,  0.0,  1.0]   # abre garra (solta)
        steps: 3

  - id: "script_simples_sobe_desce"
    enabled: false
    operation: "run_script"
    policy_after: "greedy_push"
    script:
      - action: [0.0, 0.0,  1.0, 0.0]     # sobe
        steps: 10
      - action: [0.0, 0.0, -1.0, 0.0]     # desce
        steps: 10

  # ── change_task_mode ─────────────────────────────────────────────────────────
  #
  # Muda goal + política SEM resetar a física.
  # O cubo e o robô ficam exatamente onde estão.
  #
  - id: "switch_to_pick_mode"
    enabled: false
    operation: "change_task_mode"
    at_episode: 0
    at_step: 30
    target_object: "cube_1"
    position: [0.10, 0.10, 0.15]
    tolerance: 0.05
    visual_marker: true
    behavior: "greedy_pick_and_place"

  - id: "switch_back_to_push"
    enabled: false
    operation: "change_task_mode"
    at_episode: 0
    at_step: 80
    target_object: "cube_1"
    position: [0.0, 0.20, 0.02]
    tolerance: 0.05
    visual_marker: true
    behavior: "greedy_push"

  # ── change_task ───────────────────────────────────────────────────────────────
  #
  # Troca a task inteira em tempo de execução (janela não fecha).
  # task: reach | push | slide | pick_and_place | stack | flip
  #
  - id: "switch_to_reach"
    enabled: false
    operation: "change_task"
    task: "reach"
    reward_type: "dense"
    behavior: "greedy_goal"

  - id: "switch_to_slide"
    enabled: false
    operation: "change_task"
    task: "slide"
    at_episode: 0
    at_step: 10
    reward_type: "dense"
    behavior: "greedy_push"

  - id: "switch_to_pick_place"
    enabled: false
    operation: "change_task"
    task: "pick_and_place"
    reward_type: "dense"
    behavior: "random"

  - id: "switch_to_push_step50"
    enabled: false
    operation: "change_task"
    at_episode: 0
    at_step: 50
    task: "push"
    reward_type: "dense"
    behavior: "greedy_push"
