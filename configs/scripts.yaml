# gripper: 1.0 = aberta | -1.0 = fechada
# x, y, z: posição absoluta do end-effector no mundo

pick_and_place:
  steps:
    - [0.03,  0.0,  0.12,  1.0]   # 1. acima do cubo, garra aberta
    - [0.03,  0.0,  0.02,  1.0]   # 2. desce até o cubo
    - [0.03,  0.0,  0.02, -1.0]   # 3. fecha a garra
    - [0.03,  0.0,  0.12, -1.0]   # 4. levanta o cubo
    - [0.15,  0.0,  0.12, -1.0]   # 5. move acima do target
    - [0.15,  0.0,  0.02, -1.0]   # 6. desce ao target
    - [0.15,  0.0,  0.02,  1.0]   # 7. solta o cubo

reach_only:
  steps:
    - [0.15,  0.0,  0.12,  1.0]   # 1. acima do target
    - [0.15,  0.0,  0.02,  1.0]   # 2. desce ao target
