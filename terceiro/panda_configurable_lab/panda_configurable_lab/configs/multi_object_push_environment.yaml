experiment:
  name: "multi_object_push_environment"
  seed: 77
  episodes: 3
  max_steps: 180

robot:
  control_type: "ee"
  block_gripper: true
  base_position: [-0.6, 0.0, 0.0]

simulation:
  render_mode: "human"

scene:
  table:
    length: 1.1
    width: 0.7
    height: 0.4
    x_offset: -0.3
    lateral_friction: 1.0
    spinning_friction: 0.001

task:
  type: "push"
  reward_type: "dense"
  success_threshold: 0.05

objects:
  - name: "cube_1"
    type: "box"
    size: [0.04, 0.04, 0.04]
    mass: 1.0
    initial_position: [0.0, -0.12, 0.02]
    color: [0.1, 0.2, 0.9, 1.0]
    lateral_friction: 0.8

  - name: "cube_2"
    type: "box"
    size: [0.04, 0.04, 0.04]
    mass: 1.0
    initial_position: [0.0, 0.12, 0.02]
    color: [0.9, 0.5, 0.1, 1.0]
    lateral_friction: 0.8

goals:
  mode: "fixed"
  targets:
    - object: "cube_1"
      position: [0.28, -0.14, 0.02]
      tolerance: 0.05
      visual_marker: true
    - object: "cube_2"
      position: [0.28, 0.14, 0.02]
      tolerance: 0.05
      visual_marker: true

obstacles: []

policy:
  name: "random"

logging:
  output_dir: "results/multi_object_push_environment"
