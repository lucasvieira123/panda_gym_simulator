experiment:
  name: "push_with_obstacle"
  seed: 123
  episodes: 3
  max_steps: 150

robot:
  control_type: "ee"
  block_gripper: true
  base_position: [-0.6, 0.0, 0.0]

simulation:
  render_mode: "human"

scene:
  table:
    length: 1.1
    width: 0.7
    height: 0.4
    x_offset: -0.3
    lateral_friction: 1.0
    spinning_friction: 0.001

task:
  type: "push"
  reward_type: "dense"
  success_threshold: 0.05

objects:
  - name: "cube_1"
    type: "box"
    size: [0.04, 0.04, 0.04]
    mass: 1.0
    initial_position: [0.0, -0.15, 0.02]
    color: [0.1, 0.2, 0.9, 1.0]
    lateral_friction: 0.8

goals:
  mode: "fixed"
  targets:
    - object: "cube_1"
      position: [0.30, 0.15, 0.02]
      tolerance: 0.05
      visual_marker: true

obstacles:
  - name: "wall_1"
    type: "box"
    size: [0.06, 0.30, 0.08]
    mass: 0.0
    position: [0.15, 0.00, 0.04]
    color: [0.9, 0.1, 0.1, 1.0]
    lateral_friction: 1.0

policy:
  name: "random"

logging:
  output_dir: "results/push_with_obstacle"
