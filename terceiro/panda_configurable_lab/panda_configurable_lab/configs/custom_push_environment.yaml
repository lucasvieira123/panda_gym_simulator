experiment:
  name: "custom_push_environment"
  seed: 42
  episodes: 3
  max_steps: 120

robot:
  control_type: "ee"
  block_gripper: false   # false = garra pode abrir/fechar (necessário para pick_and_place)
  base_position: [-0.6, 0.0, 0.0]

simulation:
  render_mode: "human"
  step_delay: 1.00

scene:
  table:
    length: 1.1
    width: 0.7
    height: 0.4
    x_offset: -0.3
    lateral_friction: 1.0
    spinning_friction: 0.001

objects:
  - name: "cube_1"
    type: "box"
    size: [0.04, 0.04, 0.04]
    mass: 1.0
    initial_position: [0.0, 0.0, 0.02]
    color: [0.1, 0.2, 0.9, 1.0]
    lateral_friction: 0.8
    spinning_friction: 0.001

goals:
  mode: "fixed" # fixed: alvo fixo; random: alvo aleatório a cada episódio
  targets:
    - object: "cube_1"
      position: [0.0, 0.10, 0.02]
      tolerance: 0.05
      visual_marker: true

obstacles: []

runtime:
  command_file: "runtime_commands.yaml"
  poll_every_steps: 1 # checa o command file a cada N steps para verificar se existem novos comandos habilitados para serem executados

logging:
  output_dir: "results/custom_push_environment"
