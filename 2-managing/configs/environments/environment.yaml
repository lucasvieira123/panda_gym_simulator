robot:
  control_type: "ee"
  block_gripper: false   # false = garra pode abrir/fechar (necessário para pick_and_place)
  base_position: [-0.6, 0.0, 0.0]

scene:
  table:
    length: 1.1
    width: 0.7
    height: 0.4
    x_offset: -0.3
    lateral_friction: 3.0
    spinning_friction: 0.001

objects:
  - name: "object_1"
    type: "box"
    size: [0.04, 0.04, 0.04]
    # size: [0.045, 0.030, 0.020]
    mass: 1.0
    initial_position: [-0.25, 0.0, 0.02]
    color: [0.1, 0.2, 0.9, 1.0]
    lateral_friction: 0.5  # 0.155 (escorrega)  0.5 (normal)
    spinning_friction: 0.001

  - name: "unknown_object"
    type: "box"
    size: [0.04, 0.01, 0.04]   # fino em Y — cabe entre o dedo +Y e object_1
    mass: 0.3
    initial_position: [-0.25, 0.02, 0.02]   # face -Y em y=0.03, colada na face +Y de object_1 (y=0.02)
    color: [0.9, 0.4, 0.1, 1.0]
    lateral_friction: 0.5
    spinning_friction: 0.001

