scenarios:
  - id: lANDing
    name: "LANDing"
    given: "h >= 100"
    when: "dt == 0 AND b > 10"
    do: "lAND_act"
    then: "h == 0"

  - id: shutdown
    name: "Shut Down"
    given: "armed == True"
    when: "h == 0"
    do: "shutdown_act"
    then: "armed == False"

  - id: safe_lANDing
    name: "Safe LANDing"
    given: "h >= 100"
    when: "b <= 10"
    do: "safelAND_act"
    then: "h == 0"

  - id: takeoff
    name: "Takeoff"
    given: "h == 0"
    when: "armed == True"
    do: "takeoff_act"
    then: "h >= 100"

  - id: check_status
    name: "CheckStatus"
    given: "*"
    when: "h >= 100"
    do: "checkstatus_act"
    then: "*"

  - id: flying
    name: "Flying"
    given: "h >= 100"
    when: "b > 10 AND dt > 0"
    do: "maneuver_act"
    then: "delta_dt >= 10 AND h >= 100"

transitions:
  - from: INITIAL
    to: takeoff

  - from: takeoff
    to: check_status

  - from: check_status
    to: flying

  - from: flying
    to: check_status

  - from: check_status
    to: safe_lANDing

  - from: safe_lANDing
    to: shutdown

  - from: check_status
    to: lANDing

  - from: lANDing
    to: shutdown

  - from: shutdown
    to: FINAL